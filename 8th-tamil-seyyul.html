<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>8th Tamil - செய்யுள்</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Noto Sans Tamil", "Latha", Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        /* HEADER */

        header {
            background: linear-gradient(135deg, #172554, #1d4ed8);
            color: white;
            padding: 18px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .header-content {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .back-btn {
            border: none;
            background: white;
            color: #172554;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-btn:hover {
            transform: translateY(-2px);
        }

        .header-title {
            flex: 1;
        }

        .header-title h1 {
            margin: 0;
            font-size: 25px;
        }

        .header-title p {
            margin: 4px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        /* MAIN */

        main {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 18px;
        }

        .intro {
            text-align: center;
            margin-bottom: 30px;
        }

        .intro h2 {
            margin-bottom: 8px;
            font-size: 30px;
        }

        .intro p {
            color: #5b6475;
            font-size: 16px;
        }

        /* SET BUTTONS */

        .sets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 35px;
        }

        .set-btn {
            border: none;
            padding: 22px 15px;
            border-radius: 16px;
            background: white;
            color: #172554;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
            transition: 0.2s;
        }

        .set-btn:hover {
            transform: translateY(-4px);
            background: #eff6ff;
        }

        /* QUIZ */

        #quizBox {
            display: none;
        }

        .quiz-card {
            background: white;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.09);
        }

        .quiz-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .question-number {
            background: #dbeafe;
            color: #1e40af;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: bold;
        }

        .score {
            background: #dcfce7;
            color: #166534;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: bold;
        }

        .question {
            font-size: 21px;
            font-weight: bold;
            line-height: 1.7;
            margin-bottom: 22px;
        }

        /* OPTIONS */

        .options {
            display: grid;
            gap: 13px;
        }

        .option {
            width: 100%;
            text-align: left;
            padding: 15px 17px;
            border: 2px solid #e5e7eb;
            background: #f9fafb;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .option.correct {
            background: #dcfce7;
            border-color: #22c55e;
            color: #166534;
        }

        .option.wrong {
            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }

        .option:disabled {
            cursor: default;
        }

        /* FEEDBACK */

        #feedback {
            margin-top: 20px;
            padding: 14px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            display: none;
        }

        .feedback-correct {
            background: #dcfce7;
            color: #166534;
        }

        .feedback-wrong {
            background: #fee2e2;
            color: #991b1b;
        }

        /* NEXT */

        .next-area {
            margin-top: 22px;
            text-align: right;
        }

        #nextBtn {
            display: none;
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px 25px;
            border-radius: 11px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #nextBtn:hover {
            background: #1d4ed8;
        }

        /* RESULT */

        #resultBox {
            display: none;
            text-align: center;
            background: white;
            border-radius: 20px;
            padding: 40px 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.09);
        }

        #resultBox h2 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .final-score {
            font-size: 45px;
            font-weight: bold;
            color: #1d4ed8;
            margin: 20px 0;
        }

        .restart-btn {
            border: none;
            background: #172554;
            color: white;
            padding: 14px 24px;
            border-radius: 11px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .header-content {
                flex-direction: column;
                align-items: stretch;
            }

            .back-btn {
                align-self: flex-start;
            }

            .header-title h1 {
                font-size: 22px;
            }

            .sets {
                grid-template-columns: 1fr;
            }

            .intro h2 {
                font-size: 25px;
            }

            .quiz-card {
                padding: 20px;
            }

            .question {
                font-size: 18px;
            }

            .option {
                font-size: 16px;
            }
        }
    </style>
</head>

let currentSet = 0;
let currentQuestion = 0;
let score = 0;
let answered = false;


/* START TEST */

function startTest(setIndex) {

    currentSet = setIndex;
    currentQuestion = 0;
    score = 0;
    answered = false;

    document.getElementById("intro").style.display = "none";
    document.getElementById("sets").style.display = "none";
    document.getElementById("resultBox").style.display = "none";
    document.getElementById("quizBox").style.display = "block";

    document.getElementById("score").textContent = "Score: 0";

    showQuestion();
}


/* SHOW QUESTION */

function showQuestion() {

    const data = questionSets[currentSet][currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Question " + (currentQuestion + 1) + " / 25";

    document.getElementById("question").textContent =
        data.q;

    const optionsBox = document.getElementById("options");

    optionsBox.innerHTML = "";

    document.getElementById("feedback").style.display = "none";

    document.getElementById("nextBtn").style.display = "none";

    answered = false;


    data.o.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option";

        button.textContent =
            String.fromCharCode(2949 + index) + ") " + option;

        button.onclick = () => checkAnswer(index, button);

        optionsBox.appendChild(button);

    });

}


/* CHECK ANSWER */

function checkAnswer(selected, selectedButton) {

    if (answered) return;

    answered = true;

    const data = questionSets[currentSet][currentQuestion];

    const allOptions =
        document.querySelectorAll(".option");


    allOptions.forEach(btn => {
        btn.disabled = true;
    });


    if (selected === data.a) {

        score++;

        selectedButton.classList.add("correct");

        showFeedback(
            "✓ சரியான விடை! 🎉",
            true
        );

    } else {

        selectedButton.classList.add("wrong");

        allOptions[data.a].classList.add("correct");

        showFeedback(
            "✗ தவறான விடை! சரியான விடை: " +
            data.o[data.a],
            false
        );

    }


    document.getElementById("score").textContent =
        "Score: " + score;

    document.getElementById("nextBtn").style.display =
        "inline-block";

}


/* FEEDBACK */

function showFeedback(message, correct) {

    const feedback =
        document.getElementById("feedback");

    feedback.textContent = message;

    feedback.style.display = "block";

    feedback.className =
        correct
        ? "feedback-correct"
        : "feedback-wrong";
}


/* NEXT QUESTION */

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= 25) {

        showResult();

    } else {

        showQuestion();

    }

}


/* RESULT */

function showResult() {

    document.getElementById("quizBox").style.display =
        "none";

    document.getElementById("resultBox").style.display =
        "block";

    document.getElementById("finalScore").textContent =
        score + " / 25";

}


/* RESTART */

function restartTest() {

    document.getElementById("resultBox").style.display =
        "none";

    document.getElementById("sets").style.display =
        "grid";

    document.getElementById("intro").style.display =
        "block";

}


/* BACK BUTTON */

function goBack() {

    if (
        document.getElementById("quizBox").style.display === "block"
    ) {

        document.getElementById("quizBox").style.display =
            "none";

        document.getElementById("sets").style.display =
            "grid";

        document.getElementById("intro").style.display =
            "block";

        return;
    }

    window.history.back();
}

</script>
