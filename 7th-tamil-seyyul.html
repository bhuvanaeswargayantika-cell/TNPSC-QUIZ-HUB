<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>7th Tamil - செய்யுள் | TNPSC QUIZ HUB</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, "Noto Sans Tamil", sans-serif;
            background: #f5f7fb;
            color: #172033;
            min-height: 100vh;
        }

        /* HEADER */
        header {
            background: linear-gradient(135deg, #243b55, #141e30);
            color: white;
            padding: 18px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .header-inner {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            border: none;
            background: rgba(255,255,255,0.15);
            color: white;
            padding: 11px 17px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        .header-title h1 {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .header-title p {
            font-size: 13px;
            opacity: 0.85;
        }

        /* MAIN */
        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .intro {
            text-align: center;
            margin-bottom: 30px;
        }

        .intro h2 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .intro p {
            color: #667085;
            font-size: 16px;
        }

        /* SETS */
        .sets-box {
            background: white;
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(20,30,48,0.08);
        }

        .sets-box h3 {
            text-align: center;
            margin-bottom: 22px;
            font-size: 22px;
        }

        .set-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .set-btn {
            border: none;
            background: linear-gradient(135deg, #ffffff, #eef2f7);
            border: 2px solid #dce3ec;
            padding: 18px 12px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            color: #172033;
            cursor: pointer;
            transition: 0.25s;
        }

        .set-btn:hover {
            transform: translateY(-3px);
            border-color: #243b55;
            box-shadow: 0 7px 18px rgba(36,59,85,0.12);
        }

        /* QUIZ */
        #quizArea {
            display: none;
        }

        .quiz-card {
            background: white;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(20,30,48,0.08);
        }

        .quiz-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .question-number {
            background: #edf2f7;
            padding: 9px 14px;
            border-radius: 10px;
            font-weight: bold;
        }

        .score {
            background: #e8f7ee;
            color: #18794e;
            padding: 9px 14px;
            border-radius: 10px;
            font-weight: bold;
        }

        .progress {
            width: 100%;
            height: 8px;
            background: #e8ecf2;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #243b55, #4b6cb7);
            transition: 0.3s;
        }

        .question {
            font-size: 21px;
            font-weight: bold;
            line-height: 1.7;
            margin-bottom: 22px;
        }

        .options {
            display: grid;
            gap: 13px;
        }

        .option {
            width: 100%;
            text-align: left;
            padding: 15px 17px;
            border-radius: 12px;
            border: 2px solid #dce3ec;
            background: #fafbfd;
            font-size: 17px;
            font-weight: bold;
            color: #172033;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            border-color: #4b6cb7;
            background: #f2f5fb;
        }

        .option.correct {
            background: #e8f7ee;
            border-color: #20a464;
            color: #176b45;
        }

        .option.wrong {
            background: #fff0f0;
            border-color: #e05252;
            color: #a52828;
        }

        .feedback {
            min-height: 35px;
            margin-top: 18px;
            font-size: 18px;
            font-weight: bold;
        }

        .feedback.correct-text {
            color: #16834f;
        }

        .feedback.wrong-text {
            color: #d13d3d;
        }

        .next-btn {
            margin-top: 20px;
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 12px;
            background: #243b55;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .next-btn:hover {
            background: #182b40;
        }

        /* RESULT */
        #resultArea {
            display: none;
            text-align: center;
        }

        .result-card {
            background: white;
            padding: 40px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(20,30,48,0.08);
        }

        .result-card h2 {
            font-size: 30px;
            margin-bottom: 18px;
        }

        .final-score {
            font-size: 50px;
            font-weight: bold;
            color: #243b55;
            margin-bottom: 12px;
        }

        .result-message {
            font-size: 18px;
            color: #667085;
            margin-bottom: 25px;
        }

        .restart-btn {
            border: none;
            padding: 14px 25px;
            border-radius: 12px;
            background: #243b55;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* MOBILE */
        @media (max-width: 700px) {

            .header-title h1 {
                font-size: 19px;
            }

            .header-title p {
                font-size: 11px;
            }

            .set-grid {
                grid-template-columns: 1fr;
            }

            .intro h2 {
                font-size: 25px;
            }

            .quiz-card {
                padding: 20px;
            }

            .question {
                font-size: 18px;
            }

            .option {
                font-size: 16px;
            }
        }
    </style>
</head>

<main class="container">

            </button>

        </div>

    </section>

</main>

    /* =========================
       VARIABLES
    ========================= */

    let currentSet = 0;
    let currentQuestion = 0;
    let score = 0;
    let answered = false;


    /* =========================
       BACK BUTTON
    ========================= */

    function goBack() {

        // Browser history-ல் முந்தைய page-க்கு செல்லும்
        window.history.back();

    }


    /* =========================
       START TEST
    ========================= */

    function startTest(setIndex) {

        currentSet = setIndex;
        currentQuestion = 0;
        score = 0;
        answered = false;

        document.getElementById("setArea").style.display = "none";
        document.getElementById("quizArea").style.display = "block";
        document.getElementById("resultArea").style.display = "none";

        showQuestion();
    }


    /* =========================
       SHOW QUESTION
    ========================= */

    function showQuestion() {

        answered = false;

        const questionData = questions[currentSet][currentQuestion];

        document.getElementById("questionNumber").innerText =
            "கேள்வி " + (currentQuestion + 1) + " / 25";

        document.getElementById("score").innerText =
            "Score: " + score;

        document.getElementById("question").innerText =
            questionData.q;


        const optionsBox = document.getElementById("options");

        optionsBox.innerHTML = "";


        questionData.options.forEach((option, index) => {

            const button = document.createElement("button");

            button.className = "option";

            button.innerText =
                String.fromCharCode(0x0B85 + index) + ". " + option;

            button.onclick = function() {

                selectAnswer(index, button);

            };

            optionsBox.appendChild(button);

        });


        document.getElementById("feedback").innerText = "";

        document.getElementById("feedback").className =
            "feedback";


        document.getElementById("nextBtn").style.display =
            "none";


        const progress =
            ((currentQuestion + 1) / 25) * 100;

        document.getElementById("progressBar").style.width =
            progress + "%";
    }


    /* =========================
       SELECT ANSWER
    ========================= */

    function selectAnswer(selectedIndex, selectedButton) {

        if (answered) {
            return;
        }

        answered = true;

        const questionData =
            questions[currentSet][currentQuestion];

        const allOptions =
            document.querySelectorAll(".option");


        if (selectedIndex === questionData.answer) {

            score++;

            selectedButton.classList.add("correct");

            document.getElementById("feedback").innerText =
                "✅ சரியான பதில்!";

            document.getElementById("feedback").className =
                "feedback correct-text";

        } else {

            selectedButton.classList.add("wrong");

            allOptions[questionData.answer]
                .classList.add("correct");

            document.getElementById("feedback").innerText =
                "❌ தவறான பதில்! சரியான பதில்: " +
                String.fromCharCode(0x0B85 + questionData.answer);

            document.getElementById("feedback").className =
                "feedback wrong-text";
        }


        document.getElementById("score").innerText =
            "Score: " + score;


        document.getElementById("nextBtn").style.display =
            "block";
    }


    /* =========================
       NEXT QUESTION
    ========================= */

    function nextQuestion() {

        currentQuestion++;

        if (currentQuestion >= 25) {

            showResult();

        } else {

            showQuestion();

        }
    }


    /* =========================
       RESULT
    ========================= */

    function showResult() {

        document.getElementById("quizArea").style.display =
            "none";

        document.getElementById("resultArea").style.display =
            "block";


        document.getElementById("finalScore").innerText =
            score + " / 25";


        let message = "";


        if (score >= 23) {

            message =
                "🔥 அருமை டா! உன் தயாரிப்பு ரொம்ப நல்லா இருக்கு!";

        } else if (score >= 18) {

            message =
                "👏 நல்ல முயற்சி! இன்னும் கொஞ்சம் practice பண்ணு!";

        } else if (score >= 13) {

            message =
                "👍 பரவாயில்லை! இன்னும் practice செய்தால் score உயரும்!";

        } else {

            message =
                "💪 கவலைப்படாதே! மீண்டும் Test எழுதி practice பண்ணு!";

        }


        document.getElementById("resultMessage").innerText =
            message;
    }


    /* =========================
       BACK TO SETS
    ========================= */

    function goBackToSets() {

        document.getElementById("resultArea").style.display =
            "none";

        document.getElementById("quizArea").style.display =
            "none";

        document.getElementById("setArea").style.display =
            "block";

        currentQuestion = 0;
        score = 0;
        answered = false;
    }

</script>
