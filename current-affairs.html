.weeks{

.week-btn{

.week-btn:hover{

.quiz{

}

.top{
  display:flex;

  margin-bottom:20px;
}

.qno{
  color:#1d4ed8;
}

.score{
  color:#15803d;
}

.question{
  font-size:20px;
  font-weight:bold;
  line-height:1.6;
  margin-bottom:20px;
}

.option{
  width:100%;
  padding:15px;
  margin:8px 0;
  border:2px solid #dbe2ea;
  border-radius:12px;
  background:#f8fafc;
  text-align:left;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.option:hover{
  background:#eef4ff;
}

.correct{
  background:#dcfce7 !important;
  border-color:#16a34a !important;
  color:#166534;
}

.wrong{
  background:#fee2e2 !important;
  border-color:#dc2626 !important;
  color:#991b1b;
}

.feedback{
  min-height:30px;
  margin:15px 0;
  font-size:18px;
  font-weight:bold;
}

button.action{
  border:0;
  padding:12px 20px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  margin:5px;
}

.next{
  background:#1d4ed8;
  color:white;
}

.backset{
  background:#64748b;
  color:white;
}

.result{
  display:none;
  background:white;

  color:#1d4ed8;

}

.restart{

/* ================= QUIZ ENGINE ================= */

let currentWeek = 0;
let currentQuestion = 0;
let score = 0;
let answered = false;


/* Create Week Buttons */

const weeksDiv = document.getElementById("weeks");

weeks.forEach((week,index)=>{

  const button = document.createElement("button");

  button.className = "week-btn";

  button.innerHTML =
    "📰 " + week.title +
    "<br><small>" + week.date + "</small>";

  button.onclick = () => startQuiz(index);

  weeksDiv.appendChild(button);

});


function startQuiz(index){

  currentWeek = index;
  currentQuestion = 0;
  score = 0;

  document.getElementById("weeks").style.display="none";
  document.getElementById("quiz").style.display="block";
  document.getElementById("result").style.display="none";

  showQuestion();
}


function showQuestion(){

  answered=false;

  const q =
    weeks[currentWeek].questions[currentQuestion];

  document.getElementById("qno").textContent =
    weeks[currentWeek].title +
    " | Question " +
    (currentQuestion+1) +
    " / " +
    weeks[currentWeek].questions.length;

  document.getElementById("score").textContent =
    "Score: " + score;

  document.getElementById("question").textContent =
    q.q;

  document.getElementById("feedback").textContent="";

  document.getElementById("next").style.display="none";

  const optionsDiv =
    document.getElementById("options");

  optionsDiv.innerHTML="";

  q.options.forEach((option,index)=>{

    const button =
      document.createElement("button");

    button.className="option";

    button.textContent =
      String.fromCharCode(65+index) +
      ". " +
      option;

    button.onclick=()=>{
      checkAnswer(index,button);
    };

    optionsDiv.appendChild(button);

  });
}


function checkAnswer(selected,button){

  if(answered) return;

  answered=true;

  const correct =
    weeks[currentWeek]
    .questions[currentQuestion]
    .answer;

  const allButtons =
    document.querySelectorAll(".option");

  if(selected===correct){

    score++;

    button.classList.add("correct");

    document.getElementById("feedback")
      .textContent="✅ Correct Answer!";

  }else{

    button.classList.add("wrong");

    allButtons[correct]
      .classList.add("correct");

    document.getElementById("feedback")
      .textContent="❌ Wrong Answer!";
  }

  document.getElementById("score").textContent =
    "Score: " + score;

  document.getElementById("next").style.display =
    "inline-block";
}


function nextQuestion(){

  currentQuestion++;

  if(
    currentQuestion <
    weeks[currentWeek].questions.length
  ){

    showQuestion();

  }else{

    showResult();

  }
}


function showResult(){

  document.getElementById("quiz")
    .style.display="none";

  document.getElementById("result")
    .style.display="block";

  const total =
    weeks[currentWeek].questions.length;

  document.getElementById("final")
    .textContent =
    score + " / " + total;

  let msg="";

  if(score===total){

    msg="🔥 Excellent! அந்த Week முழுவதும் perfect!";

  }else if(score>=5){

    msg="👏 Very Good! இன்னும் கொஞ்சம் revise பண்ணு!";

  }else if(score>=3){

    msg="👍 Good! அந்த வார Current Affairs-ஐ மீண்டும் படி!";

  }else{

    msg="📚 பரவாயில்லை! Restart பண்ணி மீண்டும் முயற்சி செய்!";
  }

  document.getElementById("message")
    .textContent=msg;
}


function restartQuiz(){

  score=0;
  currentQuestion=0;

  document.getElementById("result")
    .style.display="none";

  document.getElementById("quiz")
    .style.display="block";

  showQuestion();
}


function backToWeeks(){

  document.getElementById("quiz")
    .style.display="none";

  document.getElementById("result")
    .style.display="none";

  document.getElementById("weeks")
    .style.display="grid";
}
