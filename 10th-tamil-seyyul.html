<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10th Tamil - Seyyul | TNPSC QUIZ HUB</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Noto Sans Tamil", Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: linear-gradient(135deg, #172554, #2563eb);
            color: white;
            padding: 22px 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
        }

        header p {
            margin: 7px 0 0;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .back-btn {
            position: absolute;
            left: 15px;
            top: 22px;
            border: none;
            background: white;
            color: #172554;
            padding: 9px 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            width: 92%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .title-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .title-card h2 {
            margin: 0 0 8px;
            color: #172554;
        }

        .title-card p {
            margin: 0;
            color: #64748b;
        }

        .sets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .set-btn {
            border: none;
            padding: 20px 10px;
            border-radius: 15px;
            background: white;
            color: #172554;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: 0.2s;
        }

        .set-btn:hover {
            transform: translateY(-3px);
            background: #e0e7ff;
        }

        #quizBox {
            display: none;
        }

        .quiz-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
        }

        .quiz-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .question-number {
            color: #2563eb;
        }

        .score {
            color: #15803d;
        }

        .question {
            background: #f8fafc;
            padding: 20px;
            border-radius: 14px;
            font-size: 20px;
            font-weight: 800;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            width: 100%;
            text-align: left;
            border: 2px solid #e2e8f0;
            background: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .option.correct {
            background: #dcfce7;
            border-color: #16a34a;
            color: #166534;
        }

        .option.wrong {
            background: #fee2e2;
            border-color: #dc2626;
            color: #991b1b;
        }

        .feedback {
            min-height: 30px;
            margin-top: 18px;
            font-size: 18px;
            font-weight: 800;
        }

        .next-btn,
        .restart-btn,
        .sets-btn {
            border: none;
            padding: 13px 22px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 15px;
        }

        .next-btn {
            background: #2563eb;
            color: white;
        }

        .restart-btn {
            background: #16a34a;
            color: white;
        }

        .sets-btn {
            background: #475569;
            color: white;
            margin-left: 8px;
        }

        .result {
            text-align: center;
            padding: 30px 15px;
        }

        .result h2 {
            color: #172554;
            font-size: 30px;
        }

        .final-score {
            font-size: 50px;
            font-weight: 900;
            color: #2563eb;
            margin: 20px 0;
        }

        @media (max-width: 700px) {
            header h1 {
                font-size: 22px;
            }

            .back-btn {
                position: static;
                margin-bottom: 10px;
            }

            .sets {
                grid-template-columns: 1fr 1fr;
            }

            .question {
                font-size: 18px;
            }

            .option {
                font-size: 16px;
            }
        }

        @media (max-width: 450px) {
            .sets {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

/* =========================================================
   QUIZ VARIABLES
   ========================================================= */

let currentSet = 0;
let currentQuestion = 0;
let score = 0;
let answered = false;


/* =========================================================
   START QUIZ
   ========================================================= */

function startQuiz(setIndex) {

    currentSet = setIndex;
    currentQuestion = 0;
    score = 0;
    answered = false;

    document.getElementById("setBox").style.display = "none";
    document.getElementById("quizBox").style.display = "block";

    showQuestion();
}


/* =========================================================
   SHOW QUESTION
   ========================================================= */

function showQuestion() {

    answered = false;

    const question =
        questionSets[currentSet][currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Question " + (currentQuestion + 1) + " / 25";

    document.getElementById("scoreText").textContent =
        "Score: " + score;

    document.getElementById("questionText").textContent =
        question.q;

    const optionsBox =
        document.getElementById("optionsBox");

    optionsBox.innerHTML = "";

    question.o.forEach((option, index) => {

        const button =
            document.createElement("button");

        button.className = "option";
        button.textContent =
            String.fromCharCode(65 + index) + ") " + option;

        button.onclick = function () {
            checkAnswer(index, button);
        };

        optionsBox.appendChild(button);

    });

    document.getElementById("feedback").textContent = "";

    document.getElementById("nextBtn").style.display =
        "none";
}


/* =========================================================
   CHECK ANSWER
   ========================================================= */

function checkAnswer(selectedIndex, selectedButton) {

    if (answered) return;

    answered = true;

    const question =
        questionSets[currentSet][currentQuestion];

    const optionButtons =
        document.querySelectorAll(".option");

    optionButtons.forEach((button, index) => {

        if (index === question.a) {
            button.classList.add("correct");
        }

    });

    if (selectedIndex === question.a) {

        score++;

        document.getElementById("feedback").textContent =
            "✅ சரியான பதில்!";

        selectedButton.classList.add("correct");

    } else {

        document.getElementById("feedback").textContent =
            "❌ தவறான பதில்! சரியான விடை: " +
            question.o[question.a];

        selectedButton.classList.add("wrong");
    }

    document.getElementById("scoreText").textContent =
        "Score: " + score;

    document.getElementById("nextBtn").style.display =
        "inline-block";
}


/* =========================================================
   NEXT QUESTION
   ========================================================= */

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= 25) {

        showResult();

    } else {

        showQuestion();

    }
}


/* =========================================================
   RESULT
   ========================================================= */

function showResult() {

    document.querySelector(".quiz-card").innerHTML = `

        <div class="result">

            <h2>🎉 Quiz Completed!</h2>

            <p>உங்கள் இறுதி மதிப்பெண்</p>

            <div class="final-score">
                ${score} / 25
            </div>

            <p>
                ${
                    score >= 20
                    ? "🔥 Excellent! அருமையான முயற்சி!"
                    : score >= 15
                    ? "👏 Very Good! இன்னும் கொஞ்சம் practice பண்ணு!"
                    : score >= 10
                    ? "👍 Good! தொடர்ந்து பயிற்சி செய்!"
                    : "💪 Practice பண்ணினால் கண்டிப்பாக முன்னேறலாம்!"
                }
            </p>

            <button
                class="restart-btn"
                onclick="restartQuiz()">
                🔄 Restart
            </button>

            <button
                class="sets-btn"
                onclick="backToSets()">
                ← Question Sets
            </button>

        </div>
    `;
}


/* =========================================================
   RESTART
   ========================================================= */

function restartQuiz() {

    score = 0;
    currentQuestion = 0;

    location.reload();
}


/* =========================================================
   BACK TO SETS
   ========================================================= */

function backToSets() {

    location.reload();
}


/* =========================================================
   BACK BUTTON
   ========================================================= */

function goBack() {

    window.history.back();

}
