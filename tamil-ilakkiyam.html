<!DOCTYPE html>
<html lang="ta">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>இலக்கியம் | TNPSC QUIZ HUB</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Noto Sans Tamil", "Segoe UI", sans-serif;
        }

        body {
            background: #f5f7ff;
            color: #172033;
            min-height: 100vh;
        }


        /* =========================
           HEADER
        ========================= */

        header {

            background:
                linear-gradient(
                    135deg,
                    #312e81,
                    #6d28d9,
                    #be185d
                );

            color: white;

            padding: 45px 20px;

            text-align: center;

        }

        .back-btn {

            display: inline-block;

            text-decoration: none;

            color: white;

            border: 1px solid rgba(255,255,255,0.4);

            padding: 8px 18px;

            border-radius: 30px;

            font-weight: 800;

            margin-bottom: 18px;

        }

        .back-btn:hover {

            background: white;

            color: #4c1d95;

        }

        header .icon {

            font-size: 55px;

        }

        header h1 {

            font-size: clamp(38px, 7vw, 62px);

            font-weight: 950;

        }

        header p {

            color: #fef3c7;

            font-size: 18px;

            font-weight: 800;

            margin-top: 5px;

        }


        /* =========================
           MAIN
        ========================= */

        main {

            max-width: 1100px;

            margin: auto;

            padding: 55px 20px;

        }

        .title {

            text-align: center;

            margin-bottom: 40px;

        }

        .title h2 {

            font-size: 32px;

            font-weight: 950;

            color: #1e1b4b;

        }

        .title p {

            color: #667085;

            font-weight: 600;

            margin-top: 8px;

        }

        .line {

            width: 70px;

            height: 5px;

            background: linear-gradient(
                90deg,
                #7c3aed,
                #ec4899
            );

            border-radius: 20px;

            margin: 14px auto;

        }


        /* =========================
           TEST SET BUTTONS
        ========================= */

        .sets {

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 45px;

        }

        .set-btn {

            border: none;

            background: white;

            padding: 25px 15px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(30,41,90,0.08);

            border: 2px solid #e5e7eb;

            cursor: pointer;

            transition: 0.3s;

        }

        .set-btn:hover {

            transform: translateY(-6px);

            border-color: #8b5cf6;

            box-shadow:
                0 18px 35px rgba(76,29,149,0.15);

        }

        .set-btn strong {

            display: block;

            font-size: 20px;

            font-weight: 950;

            color: #312e81;

        }

        .set-btn span {

            display: block;

            margin-top: 5px;

            font-weight: 700;

            color: #6b7280;

        }


        /* =========================
           QUIZ AREA
        ========================= */

        #quizArea {

            display: none;

        }

        .quiz-box {

            background: white;

            border-radius: 28px;

            padding: 35px;

            box-shadow:
                0 15px 45px rgba(30,41,90,0.10);

            border: 1px solid #e5e7eb;

        }


        /* SCORE TOP */

        .quiz-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

            margin-bottom: 25px;

        }

        .question-number {

            background: #ede9fe;

            color: #5b21b6;

            padding: 8px 16px;

            border-radius: 30px;

            font-weight: 950;

        }

        .score-box {

            background: #ecfdf5;

            color: #047857;

            padding: 8px 16px;

            border-radius: 30px;

            font-weight: 950;

        }


        /* PROGRESS */

        .progress {

            width: 100%;

            height: 10px;

            background: #e5e7eb;

            border-radius: 20px;

            overflow: hidden;

            margin-bottom: 30px;

        }

        .progress-bar {

            height: 100%;

            width: 0%;

            background: linear-gradient(
                90deg,
                #7c3aed,
                #ec4899
            );

            transition: 0.3s;

        }


        /* QUESTION */

        .question {

            font-size: 23px;

            font-weight: 950;

            line-height: 1.6;

            color: #111827;

            margin-bottom: 25px;

        }


        /* OPTIONS */

        .options {

            display: grid;

            gap: 14px;

        }

        .option {

            width: 100%;

            text-align: left;

            border: 2px solid #e5e7eb;

            background: #fafafa;

            padding: 16px 18px;

            border-radius: 16px;

            cursor: pointer;

            font-size: 17px;

            font-weight: 900;

            color: #172033;

            transition: 0.25s;

        }

        .option:hover {

            background: #f5f3ff;

            border-color: #8b5cf6;

        }

        .option.selected {

            background: #ede9fe;

            border-color: #7c3aed;

            color: #4c1d95;

        }

        .option.correct {

            background: #dcfce7;

            border-color: #16a34a;

            color: #166534;

        }

        .option.wrong {

            background: #fee2e2;

            border-color: #dc2626;

            color: #991b1b;

        }


        /* FEEDBACK */

        .feedback {

            display: none;

            margin-top: 20px;

            padding: 15px 18px;

            border-radius: 15px;

            font-weight: 950;

            font-size: 16px;

        }

        .feedback.correct {

            display: block;

            background: #dcfce7;

            color: #166534;

        }

        .feedback.wrong {

            display: block;

            background: #fee2e2;

            color: #991b1b;

        }


        /* BUTTONS */

        .quiz-buttons {

            display: flex;

            justify-content: space-between;

            gap: 15px;

            margin-top: 28px;

        }

        .quiz-btn {

            border: none;

            padding: 13px 25px;

            border-radius: 30px;

            cursor: pointer;

            font-size: 16px;

            font-weight: 950;

        }

        .submit-btn {

            background: #7c3aed;

            color: white;

        }

        .next-btn {

            background: #059669;

            color: white;

            display: none;

        }

        .quiz-btn:hover {

            transform: translateY(-2px);

        }


        /* =========================
           RESULT
        ========================= */

        #resultArea {

            display: none;

            text-align: center;

        }

        .result-box {

            background: white;

            padding: 45px 25px;

            border-radius: 28px;

            box-shadow:
                0 15px 45px rgba(30,41,90,0.10);

        }

        .result-icon {

            font-size: 65px;

        }

        .result-box h2 {

            margin-top: 10px;

            font-size: 34px;

            font-weight: 950;

            color: #312e81;

        }

        .final-score {

            margin: 20px 0;

            font-size: 45px;

            font-weight: 950;

            color: #7c3aed;

        }

        .result-message {

            font-size: 18px;

            font-weight: 800;

            color: #4b5563;

        }

        .restart-btn {

            margin-top: 25px;

            border: none;

            background: #7c3aed;

            color: white;

            padding: 13px 28px;

            border-radius: 30px;

            font-size: 16px;

            font-weight: 950;

            cursor: pointer;

        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            margin-top: 40px;

            background: #111827;

            color: white;

            text-align: center;

            padding: 28px 20px;

        }

        footer h3 {

            font-weight: 900;

        }

        footer p {

            color: #cbd5e1;

            margin-top: 5px;

            font-size: 14px;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .sets {

                grid-template-columns: repeat(2, 1fr);

            }

        }

        @media (max-width: 550px) {

            main {

                padding: 40px 15px;

            }

            .sets {

                grid-template-columns: 1fr;

            }

            .quiz-box {

                padding: 23px;

            }

            .question {

                font-size: 20px;

            }

            .option {

                font-size: 16px;

            }

            .quiz-buttons {

                flex-direction: column;

            }

        }

    </style>

</head>

            </button>

        </div>

    </div>

/* =====================================================
   VARIABLES
===================================================== */

let currentSet = 0;

let currentQuestion = 0;

let score = 0;

let selectedAnswer = null;

let answerChecked = false;



/* =====================================================
   START QUIZ
===================================================== */

function startQuiz(setNumber) {

    currentSet = setNumber;

    currentQuestion = 0;

    score = 0;

    selectedAnswer = null;

    answerChecked = false;


    document.querySelector(".sets").style.display = "none";

    document.querySelector(".title").style.display = "none";

    document.getElementById("quizArea").style.display = "block";

    document.getElementById("resultArea").style.display = "none";


    document.getElementById("score").textContent = score;


    showQuestion();

}



/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion() {

    const questionData =
        quizSets[currentSet][currentQuestion];


    selectedAnswer = null;

    answerChecked = false;


    document.getElementById("questionNumber")
        .textContent =
        "கேள்வி " +
        (currentQuestion + 1) +
        " / 25";


    document.getElementById("question")
        .textContent =
        questionData.q;


    const optionsDiv =
        document.getElementById("options");


    optionsDiv.innerHTML = "";


    questionData.options.forEach(
        function(option, index) {

            const button =
                document.createElement("button");


            button.className = "option";


            button.textContent =
                String.fromCharCode(65 + index)
                + ". "
                + option;


            button.onclick =
                function() {

                    selectOption(index);

                };


            optionsDiv.appendChild(button);

        }
    );


    document.getElementById("feedback")
        .className = "feedback";


    document.getElementById("feedback")
        .textContent = "";


    document.getElementById("submitBtn")
        .style.display = "inline-block";


    document.getElementById("nextBtn")
        .style.display = "none";


    const progress =
        ((currentQuestion) / 25) * 100;


    document.getElementById("progressBar")
        .style.width =
        progress + "%";

}



/* =====================================================
   SELECT OPTION
===================================================== */

function selectOption(index) {

    if (answerChecked) {
        return;
    }


    selectedAnswer = index;


    const options =
        document.querySelectorAll(".option");


    options.forEach(
        function(option) {

            option.classList.remove("selected");

        }
    );


    options[index]
        .classList.add("selected");

}



/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer() {

    if (selectedAnswer === null) {

        alert("முதலில் ஒரு பதிலை தேர்வு செய்யுங்கள்!");

        return;

    }


    if (answerChecked) {
        return;
    }


    answerChecked = true;


    const questionData =
        quizSets[currentSet][currentQuestion];


    const options =
        document.querySelectorAll(".option");


    options.forEach(
        function(option, index) {

            option.disabled = true;


            if (index === questionData.answer) {

                option.classList.add("correct");

            }


            if (
                index === selectedAnswer &&
                selectedAnswer !== questionData.answer
            ) {

                option.classList.add("wrong");

            }

        }
    );



    const feedback =
        document.getElementById("feedback");



    if (
        selectedAnswer ===
        questionData.answer
    ) {

        score++;

        document.getElementById("score")
            .textContent = score;


        feedback.className =
            "feedback correct";


        feedback.textContent =
            "✓ சரியான பதில்! +1 Mark";

    }

    else {

        feedback.className =
            "feedback wrong";


        feedback.textContent =
            "✗ தவறான பதில்! சரியான பதில்: "
            +
            questionData.options[
                questionData.answer
            ];

    }



    document.getElementById("submitBtn")
        .style.display = "none";


    document.getElementById("nextBtn")
        .style.display = "inline-block";

}



/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {

    currentQuestion++;


    if (currentQuestion >= 25) {

        showResult();

        return;

    }


    showQuestion();

}



/* =====================================================
   RESULT
===================================================== */

function showResult() {

    document.getElementById("quizArea")
        .style.display = "none";


    document.getElementById("resultArea")
        .style.display = "block";


    document.getElementById("finalScore")
        .textContent =
        score + " / 25";


    let message = "";


    if (score >= 23) {

        message =
            "🏆 அசத்தலான Score! உங்கள் தயாரிப்பு மிகவும் சிறப்பாக உள்ளது.";

    }

    else if (score >= 18) {

        message =
            "👏 மிகவும் நல்ல Score! இன்னும் கொஞ்சம் பயிற்சி செய்தால் சிறந்த மதிப்பெண் பெறலாம்.";

    }

    else if (score >= 13) {

        message =
            "👍 நல்ல முயற்சி! மீண்டும் ஒருமுறை படித்து Test எழுதுங்கள்.";

    }

    else {

        message =
            "💪 கவலை வேண்டாம்! தொடர்ந்து பயிற்சி செய்தால் Score நிச்சயம் உயரும்.";

    }


    document.getElementById("resultMessage")
        .textContent = message;

}



/* =====================================================
   BACK TO TEST SETS
===================================================== */

function goBackToSets() {

    document.getElementById("resultArea")
        .style.display = "none";


    document.getElementById("quizArea")
        .style.display = "none";


    document.querySelector(".sets")
        .style.display = "grid";


    document.querySelector(".title")
        .style.display = "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}
