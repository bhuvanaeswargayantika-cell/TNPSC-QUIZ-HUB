        color: #166534;
    }

        border-color: #ef4444;
        color: #991b1b;
    }

        padding: 12px;
        border-radius: 8px;
        font-weight: bold;
        display: none;
    }

        display: block;

        color: #166534;
    }

let currentQuestion = 0;
let score = 0;
let answered = false;

function showQuestion() {

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Question " + (currentQuestion + 1) + " / " + questions.length;

    document.getElementById("score").textContent =
        "Score: " + score;

    document.getElementById("question").textContent = q.q;

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    document.getElementById("feedback").className = "feedback";
    document.getElementById("feedback").textContent = "";

    document.getElementById("nextBtn").style.display = "none";

    q.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option";
        button.textContent = option;

        button.onclick = function() {
            checkAnswer(index, button);
        };

        optionsDiv.appendChild(button);
    });
}


function checkAnswer(selectedIndex, selectedButton) {

    if (answered) return;

    answered = true;

    const q = questions[currentQuestion];
    const allButtons = document.querySelectorAll(".option");

    allButtons.forEach(button => {
        button.disabled = true;
    });

    if (selectedIndex === q.answer) {

        score++;

        selectedButton.classList.add("correct");

        document.getElementById("feedback").textContent =
            "✅ Correct Answer!";

        document.getElementById("feedback").className =
            "feedback correct-text";

    } else {

        selectedButton.classList.add("wrong");

        allButtons[q.answer].classList.add("correct");

        document.getElementById("feedback").textContent =
            "❌ Wrong Answer! Correct Answer: " + q.options[q.answer];

        document.getElementById("feedback").className =
            "feedback wrong-text";
    }

    document.getElementById("score").textContent =
        "Score: " + score;

    document.getElementById("nextBtn").style.display = "block";
}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        showResult();
    }
}


function showResult() {

    document.getElementById("quizBox").style.display = "none";
    document.getElementById("resultBox").style.display = "block";

    document.getElementById("finalScore").textContent =
        score + " / " + questions.length;

    let message = "";

    if (score >= 90) {
        message = "🏆 Excellent! உங்கள் தயாரிப்பு மிகவும் சிறப்பாக உள்ளது!";
    }
    else if (score >= 75) {
        message = "👏 Very Good! இன்னும் கொஞ்சம் practice செய்தால் super!";
    }
    else if (score >= 50) {
        message = "👍 Good! இன்னும் practice செய்யுங்கள்.";
    }
    else {
        message = "💪 Don't Give Up! மீண்டும் Mock Test எழுதுங்கள்.";
    }

    document.getElementById("resultMessage").textContent = message;
}


function restartQuiz() {

    currentQuestion = 0;
    score = 0;

    document.getElementById("resultBox").style.display = "none";
    document.getElementById("quizBox").style.display = "block";

    showQuestion();
}


function goHome() {

    window.location.href = "index.html";
}


showQuestion();
