<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;

    color:#172033;
}

header{
    background:linear-gradient(135deg,#263238,#546e7a);

    text-align:center;
    padding:28px 15px;
}

header h1{
    margin:0;
    font-size:32px;
}

header p{
    margin:8px 0 0;
    letter-spacing:1px;
}

.back{
    display:inline-block;
    margin:18px;
    padding:10px 18px;
    background:#263238;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

.container{
    max-width:950px;
    margin:auto;
    padding:20px;
}

h2{
    text-align:center;
    margin-bottom:25px;
}

.sets{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.set-btn{
    border:none;
    padding:22px 15px;
    border-radius:12px;
    background:white;
    box-shadow:0 4px 15px rgba(0,0,0,.10);
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.set-btn:hover{
    background:#37474f;
    color:white;
}

.quiz{
    display:none;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
    font-weight:bold;
}

.question{
    font-size:21px;
    font-weight:bold;
    line-height:1.6;
    margin-bottom:20px;
}

.option{
    display:block;
    width:100%;
    padding:15px;
    margin:10px 0;
    border:2px solid #d9e0e8;
    border-radius:10px;
    background:white;
    text-align:left;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.option:hover{
    background:#eceff1;
}

.correct{
    background:#d8f5df !important;
    border-color:#22a447 !important;
}

.wrong{
    background:#ffdede !important;
    border-color:#dc3545 !important;
}

.feedback{
    min-height:30px;
    margin-top:15px;
    font-size:18px;
    font-weight:bold;
}

.buttons{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:20px;
}

.action{
    border:none;
    padding:12px 20px;
    border-radius:8px;
    background:#37474f;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.result{
    display:none;
    text-align:center;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.result h2{
    color:#37474f;
}

.final-score{
    font-size:34px;
    font-weight:bold;
    margin:20px;
}

@media(max-width:650px){

    .sets{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:26px;
    }

    .question{
        font-size:19px;
    }
}
</style>
</head>

q:"பெர்லின் சுவர் எந்த நகரத்துடன் தொடர்புடையது?",
o:["பெர்லின்","பாரிஸ்","லண்டன்","ரோம்"],
a:0
},

{
q:"ஐக்கிய நாடுகள் சபையின் முக்கிய நோக்கங்களில் ஒன்று எது?",
o:["சர்வதேச அமைதி மற்றும் பாதுகாப்பை மேம்படுத்துதல்","வணிகம் மட்டும்","விளையாட்டு மட்டும்","வரி வசூல்"],
a:0
}

]

];


/* =====================================================
   VARIABLES
===================================================== */

let currentSet = 0;
let currentQuestion = 0;
let score = 0;
let answered = false;


/* =====================================================
   START QUIZ
===================================================== */

function startQuiz(setNumber){

    currentSet = setNumber;
    currentQuestion = 0;
    score = 0;
    answered = false;

    document.getElementById("sets").style.display = "none";
    document.getElementById("result").style.display = "none";
    document.getElementById("quiz").style.display = "block";

    document.getElementById("score").textContent = "0";

    showQuestion();
}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion(){

    answered = false;

    const data = quizSets[currentSet][currentQuestion];

    document.getElementById("questionNo").textContent =
        "Question " + (currentQuestion + 1) + " / 25";

    document.getElementById("question").textContent = data.q;

    document.getElementById("feedback").textContent = "";

    const options = document.getElementById("options");

    options.innerHTML = "";

    data.o.forEach(function(option,index){

        const btn = document.createElement("button");

        btn.className = "option";

        btn.textContent =
            String.fromCharCode(65 + index) + ". " + option;

        btn.onclick = function(){

            checkAnswer(index,btn);

        };

        options.appendChild(btn);

    });

    document.getElementById("nextBtn").style.display = "none";
}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(selected,selectedButton){

    if(answered) return;

    answered = true;

    const data = quizSets[currentSet][currentQuestion];

    const allButtons = document.querySelectorAll(".option");

    allButtons.forEach(function(button,index){

        if(index === data.a){

            button.classList.add("correct");

        }

    });

    if(selected === data.a){

        score++;

        document.getElementById("feedback").textContent =
            "✅ சரியான விடை!";

    }else{

        selectedButton.classList.add("wrong");

        document.getElementById("feedback").textContent =
            "❌ தவறான விடை! சரியான விடை: " + data.o[data.a];

    }

    document.getElementById("score").textContent = score;

    document.getElementById("nextBtn").style.display = "block";
}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

    if(!answered) return;

    currentQuestion++;

    if(currentQuestion >= 25){

        showResult();

    }else{

        showQuestion();

    }
}


/* =====================================================
   RESULT
===================================================== */

function showResult(){

    document.getElementById("quiz").style.display = "none";

    document.getElementById("result").style.display = "block";

    document.getElementById("finalScore").textContent = score;
}


/* =====================================================
   RESTART
===================================================== */

function restartQuiz(){

    currentQuestion = 0;
    score = 0;
    answered = false;

    document.getElementById("result").style.display = "none";

    document.getElementById("quiz").style.display = "block";

    document.getElementById("score").textContent = "0";

    showQuestion();
}


/* =====================================================
   BACK TO SETS
===================================================== */

function backToSets(){

    document.getElementById("quiz").style.display = "none";

    document.getElementById("result").style.display = "none";

    document.getElementById("sets").style.display = "grid";

}

</script>
