            padding: 17px 10px;
            font-size: 17px;

            background: #e8eefc;

        /* QUIZ */
        #quizSection {
            display: none;

            background: white;
            border-radius: 20px;
            padding: 28px;

        }

            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .badge {
            padding: 9px 15px;
            border-radius: 20px;
            background: #eef2ff;
            color: #3730a3;
            font-weight: bold;
        }

        }

            color: #64748b;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question {
            font-size: 21px;
            line-height: 1.6;
            font-weight: bold;
            margin-bottom: 22px;
        }

        .options {
            display: grid;
            gap: 13px;
        }

        .option {
            width: 100%;
            text-align: left;
            padding: 15px 17px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            color: #172033;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover:not(:disabled) {
            border-color: #64748b;
            background: #f1f5f9;
        }

        .option.correct {
            background: #dcfce7;
            border-color: #16a34a;
            color: #166534;
        }

        .option.wrong {
            background: #fee2e2;
            border-color: #dc2626;
            color: #991b1b;
        }

        .option:disabled {
            cursor: default;
        }

        .feedback {
            min-height: 32px;
            margin-top: 18px;
            font-size: 18px;
            font-weight: bold;
        }

        .correct-text {
            color: #15803d;
        }

        .wrong-text {
            color: #dc2626;
        }

            gap: 12px;

            border-radius: 11px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

            color: #334155;
        }

        .next-btn {
            background: #2563eb;
            color: white;
        }

            font-size: 17px;
            font-weight: bold;

        }

        }

            header h1 {
                font-size: 24px;

            .option {
                font-size: 16px;
            }

                flex-direction: column;
            }

            .nav-btn {
                width: 100%;
            }
        }
    </style>
</head>

    "Questions 101 – 125",
    "Questions 126 – 150"
];


/* =========================================================
   START TEST
   ========================================================= */

function startTest(setIndex) {

    currentSet = setIndex;
    currentQuestion = 0;
    score = 0;

    document.getElementById("setSection").style.display = "none";
    document.getElementById("resultSection").style.display = "none";
    document.getElementById("quizSection").style.display = "block";

    document.getElementById("setName").innerText = setNames[setIndex];

    showQuestion();
}


/* =========================================================
   SHOW QUESTION
   ========================================================= */

function showQuestion() {

    const startIndex = currentSet * 25;
    const question = questions[startIndex + currentQuestion];

    document.getElementById("questionNumber").innerText =
        "Question " + (currentQuestion + 1) + " / 25";

    document.getElementById("questionText").innerText =
        question.q;

    document.getElementById("scoreDisplay").innerText =
        "Score: " + score;

    const optionsContainer =
        document.getElementById("optionsContainer");

    optionsContainer.innerHTML = "";

    document.getElementById("feedback").innerHTML = "";

    document.getElementById("nextBtn").style.display = "none";


    question.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option";

        button.innerText =
            String.fromCharCode(0x0B85 + index) + ") " + option;

        button.onclick = function () {

            selectAnswer(index, button);

        };

        optionsContainer.appendChild(button);

    });
}


/* =========================================================
   SELECT ANSWER
   ========================================================= */

function selectAnswer(selectedIndex, selectedButton) {

    const startIndex = currentSet * 25;

    const question =
        questions[startIndex + currentQuestion];

    const allOptions =
        document.querySelectorAll(".option");

    allOptions.forEach(button => {
        button.disabled = true;
    });


    if (selectedIndex === question.answer) {

        selectedButton.classList.add("correct");

        document.getElementById("feedback").innerHTML =
            '<span class="correct-text">✓ சரியான விடை!</span>';

        score++;

    } else {

        selectedButton.classList.add("wrong");

        allOptions[question.answer].classList.add("correct");

        document.getElementById("feedback").innerHTML =
            '<span class="wrong-text">✗ தவறான விடை! சரியான விடை: ' +
            question.options[question.answer] +
            '</span>';

    }


    document.getElementById("scoreDisplay").innerText =
        "Score: " + score;

    document.getElementById("nextBtn").style.display =
        "block";
}


/* =========================================================
   NEXT QUESTION
   ========================================================= */

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= 25) {

        showResult();

    } else {

        showQuestion();

    }
}


/* =========================================================
   RESULT
   ========================================================= */

function showResult() {

    document.getElementById("quizSection").style.display = "none";

    document.getElementById("resultSection").style.display = "block";

    document.getElementById("finalScore").innerText =
        score + " / 25";


    let message = "";

    if (score >= 23) {

        message = "🔥 அருமை! உங்கள் தயாரிப்பு மிகவும் சிறப்பாக உள்ளது!";

    } else if (score >= 18) {

        message = "👏 நல்ல முயற்சி! இன்னும் கொஞ்சம் practice செய்தால் சிறப்பாக வரும்.";

    } else if (score >= 13) {

        message = "👍 பரவாயில்லை! மீண்டும் ஒருமுறை Test செய்து பாருங்கள்.";

    } else {

        message = "📚 இன்னும் கொஞ்சம் படித்து மீண்டும் முயற்சி செய்யுங்கள்.";

    }

    document.getElementById("resultMessage").innerText =
        message;
}


/* =========================================================
   BACK TO SETS
   ========================================================= */

function goBackToSets() {

    document.getElementById("quizSection").style.display = "none";

    document.getElementById("resultSection").style.display = "none";

    document.getElementById("setSection").style.display = "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

</script>
