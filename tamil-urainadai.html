  <title>தமிழ் – உரைநடை | TNPSC QUIZ HUB</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans Tamil", sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: linear-gradient(135deg, #172554, #1e3a8a);
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      letter-spacing: 1px;
    }

    .back-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 18px;
      background: white;
      color: #1e3a8a;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 950px;
      margin: 30px auto;
    }

    .title-box {
      background: white;
      padding: 28px 20px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .title-box h2 {
      color: #1e3a8a;
      margin-bottom: 8px;
    }

    .classes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .class-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100px;
      background: white;
      border-radius: 14px;
      text-decoration: none;
      color: #172033;
      font-size: 19px;
      font-weight: bold;
      border: 2px solid #dbeafe;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      transition: 0.2s;
    }

    .class-btn:hover {
      background: #eff6ff;
      border-color: #2563eb;
      color: #1d4ed8;
      transform: translateY(-3px);
    }

    @media (max-width: 700px) {
      .classes {
        grid-template-columns: repeat(2, 1fr);
      }

      header h1 {
        font-size: 25px;
      }
    }

    @media (max-width: 430px) {
      .classes {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
