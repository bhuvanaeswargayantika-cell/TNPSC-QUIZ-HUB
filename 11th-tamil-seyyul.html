    }

    .page-title p {
      margin-top: 8px;
      color: #475569;
      font-weight: bold;
    }

    .sets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .set-btn {
      border: none;
      padding: 18px 12px;
      border-radius: 12px;
      background: #ffffff;
      color: #1e3a8a;

    .set-btn:hover {

    }

      display: none;
    }

    .quiz-card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.09);
    }

    .quiz-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;

      font-size: 18px;
      font-weight: 800;
    }

    }

    .question {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 22px;
      color: #111827;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      width: 100%;
      padding: 15px 16px;
      text-align: left;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 800;
      color: #172033;
      transition: 0.2s;
    }

    .option:hover:not(:disabled) {
      background: #eff6ff;
      border-color: #60a5fa;
    }

    .option.correct {
      background: #dcfce7;
      border-color: #22c55e;
      color: #166534;
    }

    .option.wrong {
      background: #fee2e2;
      border-color: #ef4444;
      color: #991b1b;
    }

    .option:disabled {
      cursor: default;
    }

    #feedback {
      margin-top: 18px;
      padding: 13px;
      border-radius: 9px;
      font-size: 17px;
      font-weight: 800;
      display: none;
    }

    .feedback-correct {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .feedback-wrong {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

      border: none;
      padding: 13px 22px;
      border-radius: 9px;
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 20px;
      margin-right: 8px;
    }

    .next-btn {
      background: #2563eb;
    }

    .next-btn:hover {
      background: #1d4ed8;
    }

    .restart-btn {
      background: #059669;
    }

    .sets-btn {
      background: #475569;
    }

    .result {
      display: none;
      text-align: center;
      padding: 35px 20px;
    }

    .result h2 {
      color: #1d4ed8;
      font-size: 30px;
      margin-bottom: 15px;
    }

    .final-score {

      color: #059669;

    }

    .result-message {

      font-weight: bold;

      }

      }

      .question {

      }

      .option {

      }
    }

    @media (max-width: 430px) {
      .sets {
        grid-template-columns: 1fr;
      }

      .quiz-card {
        padding: 18px;
      }
    }
  </style>
</head>

let currentSet = 0;
let currentQuestion = 0;
let score = 0;
let answered = false;

function startQuiz(setIndex) {

  currentSet = setIndex;
  currentQuestion = 0;
  score = 0;
  answered = false;

  document.getElementById("setsSection").style.display = "none";
  document.getElementById("quizSection").style.display = "block";

  document.getElementById("quizContent").style.display = "block";
  document.getElementById("result").style.display = "none";

  showQuestion();
}

function showQuestion() {

  const quiz = questionSets[currentSet];
  const data = quiz[currentQuestion];

  answered = false;

  document.getElementById("questionNumber").textContent =
    `Question ${currentQuestion + 1} / ${quiz.length}`;

  document.getElementById("score").textContent =
    `Score: ${score}`;

  document.getElementById("question").textContent =
    data.q;

  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  data.o.forEach((option, index) => {

    const button = document.createElement("button");

    button.className = "option";
    button.textContent =
      `${String.fromCharCode(65 + index)}) ${option}`;

    button.onclick = () => checkAnswer(index);

    optionsDiv.appendChild(button);
  });

  const feedback = document.getElementById("feedback");

  feedback.textContent = "";
  feedback.className = "";

  document.getElementById("nextButton").style.display = "none";
}

function checkAnswer(selected) {

  if (answered) return;

  answered = true;

  const quiz = questionSets[currentSet];
  const data = quiz[currentQuestion];

  const buttons =
    document.querySelectorAll(".option");

  buttons.forEach(button => {
    button.disabled = true;
  });

  buttons[data.a].classList.add("correct");

  const feedback =
    document.getElementById("feedback");

  if (selected === data.a) {

    score++;

    feedback.textContent =
      "✅ Correct Answer!";

    feedback.className =
      "feedback-correct";

  } else {

    buttons[selected].classList.add("wrong");

    feedback.textContent =
      `❌ Wrong Answer! Correct answer: ${String.fromCharCode(65 + data.a)}) ${data.o[data.a]}`;

    feedback.className =
      "feedback-wrong";
  }

  document.getElementById("score").textContent =
    `Score: ${score}`;

  document.getElementById("nextButton").style.display =
    "inline-block";
}

function nextQuestion() {

  const quiz = questionSets[currentSet];

  if (currentQuestion < quiz.length - 1) {

    currentQuestion++;

    showQuestion();

  } else {

    showResult();
  }
}

function showResult() {

  document.getElementById("quizContent").style.display =
    "none";

  document.getElementById("result").style.display =
    "block";

  document.getElementById("finalScore").textContent =
    `${score} / 25`;

  let message = "";

  if (score === 25) {
    message = "🏆 Excellent! Full Marks!";
  }
  else if (score >= 20) {
    message = "🎉 Very Good! Keep Practising!";
  }
  else if (score >= 15) {
    message = "👍 Good! இன்னும் கொஞ்சம் Practice பண்ணலாம்!";
  }
  else if (score >= 10) {
    message = "📚 நல்ல முயற்சி! மீண்டும் ஒரு முறை படித்து Practice பண்ணு!";
  }
  else {
    message = "💪 கவலைப்படாதே! மீண்டும் படித்து மறுபடியும் Test பண்ணலாம்!";
  }

  document.getElementById("resultMessage").textContent =
    message;
}

function restartQuiz() {

  currentQuestion = 0;
  score = 0;
  answered = false;

  document.getElementById("quizContent").style.display =
    "block";

  document.getElementById("result").style.display =
    "none";

  showQuestion();
}

function backToSets() {

  document.getElementById("quizSection").style.display =
    "none";

  document.getElementById("setsSection").style.display =
    "block";
}

function goBack() {

  if (document.getElementById("quizSection").style.display === "block") {

    backToSets();

  } else {

    window.history.back();

  }
}

</script>
