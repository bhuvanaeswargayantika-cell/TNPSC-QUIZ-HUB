<!DOCTYPE html>

<head>

<title>Science - TNPSC QUIZ HUB</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Tamil",sans-serif;
    background:#f3f7fb;
    color:#172033;
}

header{
    background:linear-gradient(135deg,#102a43,#1d4ed8);
    color:white;
    text-align:center;
    padding:28px 15px;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:8px 0 0;
    letter-spacing:2px;
    font-size:14px;
}

.back-home{
    display:inline-block;
    margin:18px;
    padding:10px 18px;
    background:white;
    color:#1d4ed8;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h2{
    color:#102a43;
}

.title p{
    color:#64748b;
}

/* SET BUTTONS */

.sets{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:15px;
}

.set-btn{
    border:none;
    padding:20px 15px;
    border-radius:15px;
    background:white;
    cursor:pointer;
    font-size:17px;
    font-weight:bold;
    color:#172033;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    transition:.2s;
}

.set-btn:hover{
    transform:translateY(-3px);
    background:#eaf1ff;
}

.set-btn small{
    display:block;
    margin-top:7px;
    color:#64748b;
}

/* QUIZ */

.quiz-box{
    display:none;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.quiz-top{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
    font-weight:bold;
}

.question-number{
    color:#1d4ed8;
}

.score{
    color:#15803d;
}

.question{
    font-size:21px;
    font-weight:bold;
    line-height:1.6;
    margin-bottom:20px;
}

.option{
    width:100%;
    display:block;
    padding:15px;
    margin:9px 0;
    border:2px solid #dbe2ea;
    border-radius:12px;
    background:#f8fafc;
    text-align:left;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.option:hover{
    background:#eef4ff;
}

.option.correct{
    background:#dcfce7;
    border-color:#16a34a;
    color:#166534;
}

.option.wrong{
    background:#fee2e2;
    border-color:#dc2626;
    color:#991b1b;
}

.feedback{
    min-height:30px;
    margin:15px 0;
    font-size:18px;
    font-weight:bold;
}

.next-btn,
.back-btn,
.restart-btn{
    border:none;
    padding:12px 20px;
    margin:5px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.next-btn{
    background:#1d4ed8;
    color:white;
}

.back-btn{
    background:#64748b;
    color:white;
}

.restart-btn{
    background:#15803d;
    color:white;
}

/* RESULT */

.result-box{
    display:none;
    background:white;
    text-align:center;
    padding:35px 20px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.result-box h2{
    color:#102a43;
}

.final-score{
    font-size:42px;
    font-weight:bold;
    color:#1d4ed8;
    margin:15px;
}

@media(max-width:600px){

    header h1{
        font-size:24px;
    }

    .question{
        font-size:18px;
    }

    .quiz-box{
        padding:18px;
    }

    .option{
        font-size:15px;
    }
}
</style>
</head>

/* ==========================================
   VARIABLES
========================================== */

let currentSet = 0;
let currentQuestion = 0;
let score = 0;
let answered = false;


/* ==========================================
   START QUIZ
========================================== */

function startQuiz(setIndex){

    currentSet = setIndex;
    currentQuestion = 0;
    score = 0;

    document.getElementById("sets").style.display = "none";

    document.getElementById("quizBox").style.display = "block";

    document.getElementById("resultBox").style.display = "none";

    showQuestion();
}


/* ==========================================
   SHOW QUESTION
========================================== */

function showQuestion(){

    answered = false;

    const question =
        questionSets[currentSet][currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Question " +
        (currentQuestion + 1) +
        " / 25";

    document.getElementById("scoreText").textContent =
        "Score: " + score;

    document.getElementById("question").textContent =
        question.q;

    document.getElementById("feedback").textContent = "";

    document.getElementById("nextBtn").style.display =
        "none";

    const optionsDiv =
        document.getElementById("options");

    optionsDiv.innerHTML = "";

    question.options.forEach(function(option,index){

        const button =
            document.createElement("button");

        button.className = "option";

        button.textContent =
            String.fromCharCode(65 + index) +
            ". " +
            option;

        button.onclick = function(){

            checkAnswer(index,button);

        };

        optionsDiv.appendChild(button);

    });
}


/* ==========================================
   CHECK ANSWER
========================================== */

function checkAnswer(selectedIndex,selectedButton){

    if(answered){
        return;
    }

    answered = true;

    const correctIndex =
        questionSets[currentSet][currentQuestion].answer;

    const allButtons =
        document.querySelectorAll(".option");

    if(selectedIndex === correctIndex){

        score++;

        selectedButton.classList.add("correct");

        document.getElementById("feedback").textContent =
            "✅ Correct Answer!";

    }
    else{

        selectedButton.classList.add("wrong");

        allButtons[correctIndex].classList.add("correct");

        document.getElementById("feedback").textContent =
            "❌ Wrong Answer!";

    }

    document.getElementById("scoreText").textContent =
        "Score: " + score;

    document.getElementById("nextBtn").style.display =
        "inline-block";
}


/* ==========================================
   NEXT QUESTION
========================================== */

function nextQuestion(){

    currentQuestion++;

    if(currentQuestion < 25){

        showQuestion();

    }
    else{

        showResult();

    }
}


/* ==========================================
   SHOW RESULT
========================================== */

function showResult(){

    document.getElementById("quizBox").style.display =
        "none";

    document.getElementById("resultBox").style.display =
        "block";

    document.getElementById("finalScore").textContent =
        score + " / 25";

    let message = "";

    if(score >= 23){

        message =
            "🔥 Excellent! Science preparation super!";

    }
    else if(score >= 18){

        message =
            "👏 Very Good! இன்னும் கொஞ்சம் practice பண்ணு!";

    }
    else if(score >= 13){

        message =
            "👍 Good! இன்னும் revise பண்ணினால் score improve ஆகும்!";

    }
    else{

        message =
            "📚 பரவாயில்லை! மீண்டும் test பண்ணு!";

    }

    document.getElementById("resultMessage").textContent =
        message;
}


/* ==========================================
   RESTART
========================================== */

function restartQuiz(){

    currentQuestion = 0;
    score = 0;

    document.getElementById("resultBox").style.display =
        "none";

    document.getElementById("quizBox").style.display =
        "block";

    showQuestion();
}


/* ==========================================
   BACK TO SETS
========================================== */

function backToSets(){

    document.getElementById("quizBox").style.display =
        "none";

    document.getElementById("resultBox").style.display =
        "none";

    document.getElementById("sets").style.display =
        "grid";
}
