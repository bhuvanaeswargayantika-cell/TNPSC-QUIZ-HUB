*{

}

}

.sets{

}

.set-btn{

    color:#1d4ed8;

}

.set-btn:hover{

    background:#eff6ff;
}

.quiz-box{
    display:none;
    background:white;
    padding:25px;

}

.quiz-top{
    display:flex;

    margin-bottom:20px;

}

.question-number{
    font-weight:bold;
    color:#1d4ed8;
}

.score{
    font-weight:bold;
    color:#047857;
}

.question{
    font-size:21px;
    font-weight:bold;
    line-height:1.6;
    margin-bottom:20px;
}

.options{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.option{
    width:100%;
    text-align:left;
    border:2px solid #e5e7eb;
    background:#f9fafb;
    padding:14px;
    border-radius:10px;
    cursor:pointer;
    font-size:17px;
    font-weight:bold;
    color:#111827;
    transition:.2s;
}

.option:hover{
    border-color:#2563eb;
    background:#eff6ff;
}

.option.correct{
    background:#dcfce7;
    border-color:#16a34a;
    color:#166534;
}

.option.wrong{
    background:#fee2e2;
    border-color:#dc2626;
    color:#991b1b;
}

.feedback{
    margin-top:18px;
    font-size:18px;
    font-weight:bold;
    min-height:28px;
}

.next-btn,
.restart-btn,
.sets-btn{
    border:none;
    padding:12px 20px;
    border-radius:9px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;

.next-btn{
    background:#2563eb;

}

.restart-btn{
    background:#059669;
    color:white;
}

.sets-btn{
    background:#6b7280;

let currentSet = 0;
let currentQuestion = 0;
let score = 0;
let answered = false;

const setSection = document.getElementById("setSection");
const quizBox = document.getElementById("quizBox");
const resultBox = document.getElementById("resultBox");

const questionNumber = document.getElementById("questionNumber");
const question = document.getElementById("question");
const options = document.getElementById("options");
const feedback = document.getElementById("feedback");
const scoreDisplay = document.getElementById("score");
const nextBtn = document.getElementById("nextBtn");

function startQuiz(setIndex){

    currentSet = setIndex;
    currentQuestion = 0;
    score = 0;
    answered = false;

    setSection.style.display = "none";
    resultBox.style.display = "none";
    quizBox.style.display = "block";

    showQuestion();
}

function showQuestion(){

    const q = questionSets[currentSet][currentQuestion];

    questionNumber.textContent =
        `Question ${currentQuestion + 1} / 25`;

    scoreDisplay.textContent =
        `Score: ${score}`;

    question.textContent = q.q;

    options.innerHTML = "";

    feedback.textContent = "";

    nextBtn.style.display = "none";

    answered = false;

    q.o.forEach((optionText,index)=>{

        const button = document.createElement("button");

        button.className = "option";
        button.textContent =
            `${String.fromCharCode(65 + index)}) ${optionText}`;

        button.onclick = () =>
            checkAnswer(index,button);

        options.appendChild(button);

    });
}

function checkAnswer(selected,clickedButton){

    if(answered) return;

    answered = true;

    const q = questionSets[currentSet][currentQuestion];

    const allOptions =
        document.querySelectorAll(".option");

    allOptions.forEach((button,index)=>{

        button.disabled = true;

        if(index === q.a){
            button.classList.add("correct");
        }

    });

    if(selected === q.a){

        score++;

        feedback.textContent =
            "✅ Correct Answer!";

        feedback.style.color = "#15803d";

    }else{

        clickedButton.classList.add("wrong");

        feedback.textContent =
            `❌ Wrong Answer! Correct Answer: ${
                String.fromCharCode(65 + q.a)
            }) ${q.o[q.a]}`;

        feedback.style.color = "#dc2626";
    }

    scoreDisplay.textContent =
        `Score: ${score}`;

    nextBtn.style.display = "inline-block";
}

function nextQuestion(){

    if(currentQuestion < 24){

        currentQuestion++;

        showQuestion();

    }else{

        showResult();

    }
}

function showResult(){

    quizBox.style.display = "none";
    resultBox.style.display = "block";

    document.getElementById("finalScore").textContent =
        `${score} / 25`;

}

function restartQuiz(){

    currentQuestion = 0;
    score = 0;

    resultBox.style.display = "none";
    quizBox.style.display = "block";

    showQuestion();
}

function backToSets(){

    resultBox.style.display = "none";
    quizBox.style.display = "none";
    setSection.style.display = "block";

}

function goBack(){

    window.history.back();

}
