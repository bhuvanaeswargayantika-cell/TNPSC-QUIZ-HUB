/* =====================================================
   QUIZ FUNCTIONS
===================================================== */

let currentSet = 0;
let currentQuestion = 0;
let score = 0;
let answered = false;

function startQuiz(setIndex){

    currentSet = setIndex;
    currentQuestion = 0;
    score = 0;
    answered = false;

    document.getElementById("sets").style.display = "none";
    document.getElementById("result").style.display = "none";
    document.getElementById("quizBox").style.display = "block";

    document.getElementById("score").textContent = score;

    showQuestion();
}

function showQuestion(){

    answered = false;

    const q = questionSets[currentSet][currentQuestion];

    document.getElementById("questionNumber").textContent =
        `Question ${currentQuestion + 1} / 25`;

    document.getElementById("question").textContent = q.q;

    document.getElementById("feedback").textContent = "";

    const optionsDiv = document.getElementById("options");

    optionsDiv.innerHTML = "";

    q.o.forEach((option,index)=>{

        const button = document.createElement("button");

        button.className = "option";

        button.textContent =
            `${String.fromCharCode(65 + index)}. ${option}`;

        button.onclick = function(){

            checkAnswer(index,button);

        };

        optionsDiv.appendChild(button);

    });

    document.getElementById("nextBtn").style.display = "none";
}

function checkAnswer(selectedIndex,selectedButton){

    if(answered) return;

    answered = true;

    const q = questionSets[currentSet][currentQuestion];

    const buttons = document.querySelectorAll(".option");

    buttons.forEach((btn,index)=>{

        if(index === q.a){

            btn.classList.add("correct");

        }

    });

    if(selectedIndex === q.a){

        score++;

        document.getElementById("feedback").textContent =
            "✅ சரியான விடை!";

    }else{

        selectedButton.classList.add("wrong");

        document.getElementById("feedback").textContent =
            `❌ தவறான விடை! சரியான விடை: ${q.o[q.a]}`;

    }

    document.getElementById("score").textContent = score;

    document.getElementById("nextBtn").style.display = "block";
}

function nextQuestion(){

    if(!answered) return;

    currentQuestion++;

    if(currentQuestion >= 25){

        showResult();

    }else{

        showQuestion();

    }
}

function showResult(){

    document.getElementById("quizBox").style.display = "none";

    document.getElementById("result").style.display = "block";

    document.getElementById("finalScore").textContent = score;
}

function restartQuiz(){

    document.getElementById("result").style.display = "none";

    document.getElementById("quizBox").style.display = "block";

    currentQuestion = 0;
    score = 0;

    document.getElementById("score").textContent = score;

    showQuestion();
}

function backToSets(){

    document.getElementById("quizBox").style.display = "none";

    document.getElementById("result").style.display = "none";

    document.getElementById("sets").style.display = "grid";
}

</script>
