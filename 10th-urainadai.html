let currentSet = 0;
let currentQuestion = 0;
let score = 0;
let answered = false;


/* =========================
   START QUIZ
========================= */

function startQuiz(setIndex) {

  currentSet = setIndex;
  currentQuestion = 0;
  score = 0;
  answered = false;

  document.getElementById("setsBox").style.display = "none";

  document.getElementById("quizBox").style.display = "block";

  document.getElementById("resultBox").style.display = "none";

  document.getElementById("scoreText").textContent =
    "Score: 0";

  showQuestion();
}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion() {

  answered = false;

  const question =
    questionSets[currentSet][currentQuestion];

  document.getElementById("questionNumber").textContent =
    `Question ${currentQuestion + 1} / 25`;

  document.getElementById("questionText").textContent =
    question.q;

  document.getElementById("feedback").textContent = "";

  document.getElementById("nextBtn").style.display =
    "none";

  const optionsBox =
    document.getElementById("optionsBox");

  optionsBox.innerHTML = "";

  question.options.forEach((option, index) => {

    const button =
      document.createElement("button");

    button.className = "option";

    button.textContent =
      `${String.fromCharCode(65 + index)}. ${option}`;

    button.onclick = function () {
      checkAnswer(index, button);
    };

    optionsBox.appendChild(button);

  });

}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(selectedIndex, selectedButton) {

  if (answered) return;

  answered = true;

  const question =
    questionSets[currentSet][currentQuestion];

  const buttons =
    document.querySelectorAll(".option");

  buttons.forEach(button => {
    button.disabled = true;
  });


  if (selectedIndex === question.answer) {

    selectedButton.classList.add("correct");

    document.getElementById("feedback").textContent =
      "✅ Correct Answer!";

    document.getElementById("feedback").style.color =
      "#08753f";

    score++;

  } else {

    selectedButton.classList.add("wrong");

    buttons[question.answer].classList.add("correct");

    document.getElementById("feedback").textContent =
      "❌ Wrong Answer! சரியான விடை காட்டப்பட்டுள்ளது.";

    document.getElementById("feedback").style.color =
      "#a51f1f";
  }


  document.getElementById("scoreText").textContent =
    `Score: ${score}`;

  document.getElementById("nextBtn").style.display =
    "inline-block";

}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion() {

  currentQuestion++;

  if (currentQuestion < 25) {

    showQuestion();

  } else {

    showResult();

  }

}


/* =========================
   RESULT
========================= */

function showResult() {

  document.getElementById("quizBox").style.display =
    "none";

  document.getElementById("resultBox").style.display =
    "block";

  document.getElementById("finalScore").textContent =
    `${score} / 25`;

}


/* =========================
   RESTART
========================= */

function restartQuiz() {

  currentQuestion = 0;
  score = 0;
  answered = false;

  document.getElementById("resultBox").style.display =
    "none";

  document.getElementById("quizBox").style.display =
    "block";

  document.getElementById("scoreText").textContent =
    "Score: 0";

  showQuestion();

}


/* =========================
   BACK TO SETS
========================= */

function backToSets() {

  document.getElementById("resultBox").style.display =
    "none";

  document.getElementById("quizBox").style.display =
    "none";

  document.getElementById("setsBox").style.display =
    "block";

}


/* =========================
   BACK TO URAINADAI PAGE
========================= */

function goBack() {

  window.location.href =
    "tamil-urainadai.html";

}
