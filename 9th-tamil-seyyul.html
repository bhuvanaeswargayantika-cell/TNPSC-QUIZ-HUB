            color: #172033;
        }

        header {
            background: linear-gradient(135deg, #182848, #4b6cb7);

            padding: 18px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .header-content {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .site-title {
            margin: 0;
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .back-btn {
            border: none;
            background: white;
            color: #243b6b;
            padding: 10px 17px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-btn:hover {
            transform: translateY(-2px);
        }

        /* MAIN */
        main {
            max-width: 1000px;
            margin: auto;
            padding: 35px 18px 60px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 28px;
        }

        .page-title h1 {
            margin: 0;
            font-size: 32px;
            color: #182848;
        }

        .page-title p {
            margin-top: 8px;
            color: #596579;
            font-size: 16px;
        }

        /* SETS */
        .sets {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .sets h2 {
            text-align: center;
            margin-top: 0;
            color: #253b70;
        }

        .set-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .set-btn {
            border: none;
            padding: 18px 10px;
            border-radius: 13px;
            background: #e8eefc;
            color: #20386f;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .set-btn:hover {
            background: #d4def8;
            transform: translateY(-3px);
        }

        /* QUIZ */
        #quizArea {
            display: none;
        }

        .quiz-header {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .quiz-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .progress {
            font-weight: 800;
            color: #304a88;
        }

        .score {
            font-weight: 900;
            color: #14804a;
        }

        .question-box {
            background: white;
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .question {
            font-size: 21px;
            font-weight: 900;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .options {
            display: grid;
            gap: 13px;
        }

        .option {
            width: 100%;
            text-align: left;
            border: 2px solid #dce3ef;
            background: #f9fbff;
            padding: 15px 17px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            background: #eef3ff;
            border-color: #7891d1;
        }

        .option.correct {
            background: #dff7e9;
            border-color: #27a45f;
            color: #116638;
        }

        .option.wrong {
            background: #ffe1e1;
            border-color: #df4b4b;
            color: #a51f1f;
        }

        .feedback {
            min-height: 30px;
            margin-top: 18px;
            font-size: 18px;
            font-weight: 900;
        }

        .next-btn,
        .restart-btn {
            border: none;
            padding: 13px 22px;
            border-radius: 11px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 18px;
        }

        .next-btn {
            background: #253f7a;
            color: white;
        }

        .restart-btn {
            background: #16804d;
            color: white;
        }

        .next-btn:hover,
        .restart-btn:hover {
            transform: translateY(-2px);
        }

        /* RESULT */
        .result {
            display: none;
            background: white;
            padding: 35px 25px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);

            color: #20386f;
            font-size: 30px;
        }

            font-size: 48px;
            font-weight: 900;
            color: #16804d;
            margin: 15px 0;
        }

            .site-title {
                font-size: 20px;
            }

                flex-direction: column;
            }

            }

            .set-buttons {

            }

            .question {
                font-size: 18px;
            }

            .option {
                font-size: 16px;
            }

            main {
                padding-top: 25px;
            }
        }
    </style>
</head>

let currentSet = 0;
let currentQuestion = 0;
let score = 0;
let answered = false;


/* START QUIZ */

function startQuiz(setNumber) {

    currentSet = setNumber;
    currentQuestion = 0;
    score = 0;
    answered = false;

    document.getElementById("setArea").style.display = "none";
    document.getElementById("resultArea").style.display = "none";
    document.getElementById("quizArea").style.display = "block";

    showQuestion();
}


/* SHOW QUESTION */

function showQuestion() {

    const quiz = quizSets[currentSet][currentQuestion];

    document.getElementById("progress").textContent =
        "கேள்வி " + (currentQuestion + 1) + " / 25";

    document.getElementById("score").textContent =
        "Score: " + score;

    document.getElementById("question").textContent =
        (currentSet * 25 + currentQuestion + 1) + ". " + quiz.q;

    const optionsDiv = document.getElementById("options");

    optionsDiv.innerHTML = "";

    document.getElementById("feedback").textContent = "";

    document.getElementById("nextBtn").style.display = "none";

    answered = false;


    quiz.o.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option";

        button.textContent =
            String.fromCharCode(2949 + index) + ") " + option;

        button.onclick = function () {
            checkAnswer(index, button);
        };

        optionsDiv.appendChild(button);

    });
}


/* CHECK ANSWER */

function checkAnswer(selected, selectedButton) {

    if (answered) {
        return;
    }

    answered = true;

    const quiz = quizSets[currentSet][currentQuestion];

    const allOptions =
        document.querySelectorAll(".option");

    if (selected === quiz.a) {

        selectedButton.classList.add("correct");

        score++;

        document.getElementById("feedback").textContent =
            "✅ சரியான பதில்!";

        document.getElementById("feedback").style.color =
            "#16804d";

    } else {

        selectedButton.classList.add("wrong");

        allOptions[quiz.a].classList.add("correct");

        document.getElementById("feedback").textContent =
            "❌ தவறான பதில்! சரியான பதிலை பச்சை நிறத்தில் காட்டியுள்ளோம்.";

        document.getElementById("feedback").style.color =
            "#c62828";
    }


    document.getElementById("score").textContent =
        "Score: " + score;


    document.getElementById("nextBtn").style.display =
        "inline-block";


    if (currentQuestion === 24) {

        document.getElementById("nextBtn").textContent =
            "🏁 Result பார்க்கலாம்";

    } else {

        document.getElementById("nextBtn").textContent =
            "Next →";
    }
}


/* NEXT QUESTION */

function nextQuestion() {

    if (!answered) {
        return;
    }

    if (currentQuestion < 24) {

        currentQuestion++;

        showQuestion();

    } else {

        showResult();
    }
}


/* RESULT */

function showResult() {

    document.getElementById("quizArea").style.display = "none";

    document.getElementById("resultArea").style.display = "block";

    document.getElementById("finalScore").textContent =
        score + " / 25";
}


/* RESTART */

function restartQuiz() {

    currentQuestion = 0;
    score = 0;
    answered = false;

    document.getElementById("resultArea").style.display = "none";

    document.getElementById("quizArea").style.display = "block";

    showQuestion();
}


/* BACK TO SETS */

function backToSets() {

    document.getElementById("resultArea").style.display = "none";

    document.getElementById("quizArea").style.display = "none";

    document.getElementById("setArea").style.display = "block";
}


/* BACK BUTTON */

function goBack() {

    if (document.getElementById("quizArea").style.display === "block") {

        document.getElementById("quizArea").style.display = "none";

        document.getElementById("resultArea").style.display = "none";

        document.getElementById("setArea").style.display = "block";

    } else {

        window.history.back();

    }
}

</script>
