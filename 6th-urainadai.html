let currentSet = 0;
let currentQuestion = 0;
let score = 0;
let answered = false;


/* START QUIZ */

function startQuiz(setIndex) {

  currentSet = setIndex;
  currentQuestion = 0;
  score = 0;
  answered = false;

  document.getElementById("sets").style.display = "none";
  document.getElementById("quizBox").style.display = "block";
  document.getElementById("resultBox").style.display = "none";

  showQuestion();
}


/* SHOW QUESTION */

function showQuestion() {

  answered = false;

  const questionData =
    questionSets[currentSet][currentQuestion];

  document.getElementById("questionNumber").textContent =
    `கேள்வி ${currentQuestion + 1} / 25`;

  document.getElementById("score").textContent =
    `Score: ${score}`;

  document.getElementById("question").textContent =
    questionData.q;

  const optionsDiv =
    document.getElementById("options");

  optionsDiv.innerHTML = "";

  questionData.o.forEach((option, index) => {

    const button = document.createElement("button");

    button.className = "option";

    button.textContent =
      `${String.fromCharCode(65 + index)}) ${option}`;

    button.onclick = () =>
      checkAnswer(index, button);

    optionsDiv.appendChild(button);
  });

  document.getElementById("feedback").style.display = "none";
  document.getElementById("feedback").className = "feedback";

  document.getElementById("nextBtn").style.display = "none";
}


/* CHECK ANSWER */

function checkAnswer(selectedIndex, selectedButton) {

  if (answered) return;

  answered = true;

  const questionData =
    questionSets[currentSet][currentQuestion];

  const buttons =
    document.querySelectorAll(".option");

  buttons.forEach((button, index) => {

    button.disabled = true;

    if (index === questionData.a) {
      button.classList.add("correct");
    }

  });

  const feedback =
    document.getElementById("feedback");

  if (selectedIndex === questionData.a) {

    score++;

    selectedButton.classList.add("correct");

    feedback.textContent =
      "✅ சரியான பதில்!";

    feedback.className =
      "feedback correct";

  } else {

    selectedButton.classList.add("wrong");

    feedback.textContent =
      `❌ தவறான பதில்! சரியான பதில்: ${
        questionData.o[questionData.a]
      }`;

    feedback.className =
      "feedback wrong";
  }

  document.getElementById("score").textContent =
    `Score: ${score}`;

  document.getElementById("nextBtn").style.display =
    "inline-block";
}


/* NEXT QUESTION */

function nextQuestion() {

  currentQuestion++;

  if (currentQuestion < 25) {

    showQuestion();

  } else {

    showResult();

  }
}


/* RESULT */

function showResult() {

  document.getElementById("quizBox").style.display =
    "none";

  document.getElementById("resultBox").style.display =
    "block";

  document.getElementById("finalScore").textContent =
    `${score} / 25`;
}


/* RESTART */

function restartQuiz() {

  currentQuestion = 0;
  score = 0;
  answered = false;

  document.getElementById("resultBox").style.display =
    "none";

  document.getElementById("quizBox").style.display =
    "block";

  showQuestion();
}


/* BACK TO SETS */

function backToSets() {

  document.getElementById("resultBox").style.display =
    "none";

  document.getElementById("quizBox").style.display =
    "none";

  document.getElementById("sets").style.display =
    "grid";

}


/* BACK BUTTON */

function goBack() {
  window.history.back();
}

</script>
